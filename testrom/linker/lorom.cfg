MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    RAM:  start = $0200, size = $1D00, type = rw, file = "";
    ROM:  start = $008000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, optional = yes;
    CODE:     load = ROM, type = ro, start = $008000;
    RODATA:   load = ROM, type = ro;
    FONT:     load = ROM, type = ro;
    HEADER:   load = ROM, type = ro, start = $00FFC0;
    VECTORS:  load = ROM, type = ro, start = $00FFE0;
}
